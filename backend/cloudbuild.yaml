steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --platform=linux/amd64
      - -t
      - asia-east1-docker.pkg.dev/$PROJECT_ID/financial-research/backend:test-$BUILD_ID
      - .
images:
  - asia-east1-docker.pkg.dev/$PROJECT_ID/financial-research/backend:test-$BUILD_ID
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
