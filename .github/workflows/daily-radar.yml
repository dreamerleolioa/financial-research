    runs-on: ubuntu-latest
    needs: resolve-run-context
    if: needs.resolve-run-context.outputs.market_open == 'true' && (github.event.schedule == '50 15 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.step == 'run-forward-validation'))
    steps:
      - name: Validate mature 5 / 10 / 20-day windows
        env:
          ZEABUR_BACKEND_URL: ${{ secrets.ZEABUR_BACKEND_URL }}
          DAILY_RADAR_INTERNAL_TOKEN: ${{ secrets.DAILY_RADAR_INTERNAL_TOKEN }}
          DAILY_RADAR_RUN_DATE: ${{ needs.resolve-run-context.outputs.run_date }}
        run: |
          set -euo pipefail
          endpoint="${ZEABUR_BACKEND_URL%/}/internal/daily-radar/forward-validation/run"
          response_file="$(mktemp)"
          payload="$(jq -n \
            --arg as_of_date "${DAILY_RADAR_RUN_DATE}" \
            '{
              mode: "due",
              market: "TW",
              as_of_date: $as_of_date,
              windows: [5, 10, 20],
              benchmark_symbol: "TAIEX"
            }')"
          http_status="$(curl -sS -o "$response_file" -w "%{http_code}" \
            -X POST "$endpoint" \
            -H "Authorization: Bearer ${DAILY_RADAR_INTERNAL_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${payload}")"
          echo "Forward-validation HTTP status: ${http_status}"
          if [[ ! "$http_status" =~ ^2[0-9][0-9]$ ]]; then
            cat "$response_file"
            exit 1
          fi
          jq '{
            status,
            mode,
            as_of_date,
            candidate_count,
            records_written,
            validated_count,
            skipped_count,
            retryable_skipped_count,
            terminal_skipped_count,
            skip_reasons: (.report.skip_reasons // {})
          }' "$response_file"
          jq -e '.status == "completed" and .retryable_skipped_count == 0' "$response_file" > /dev/null

  repair-avwap-and-rescore:
    name: Repair Daily Radar OHLCV/AVWAP and rescore
    runs-on: ubuntu-latest
    needs: resolve-run-context
    if: needs.resolve-run-context.outputs.market_open == 'true' && (github.event.schedule == '0 23 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.step == 'repair-avwap-and-rescore'))
    steps:
      - name: Repair OHLCV/AVWAP and rescore
        env:
          ZEABUR_BACKEND_URL: ${{ secrets.ZEABUR_BACKEND_URL }}
          DAILY_RADAR_INTERNAL_TOKEN: ${{ secrets.DAILY_RADAR_INTERNAL_TOKEN }}
          DAILY_RADAR_RUN_DATE: ${{ needs.resolve-run-context.outputs.run_date }}
        run: |
          set -euo pipefail
          run_date="${DAILY_RADAR_RUN_DATE}"
          daily_radar_payload="{\"market\":\"TW\",\"run_date\":\"${run_date}\"}"

          ohlcv_response_file="$(mktemp)"
          ohlcv_endpoint="${ZEABUR_BACKEND_URL%/}/internal/daily-radar/refresh-ohlcv"
          echo "Daily Radar repair refresh-ohlcv run_date: ${run_date}"
          ohlcv_http_status="$(curl -sS -o "$ohlcv_response_file" -w "%{http_code}" \
            -X POST "$ohlcv_endpoint" \
            -H "Authorization: Bearer ${DAILY_RADAR_INTERNAL_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${daily_radar_payload}")"
          echo "OHLCV HTTP status: ${ohlcv_http_status}"
          if [[ ! "$ohlcv_http_status" =~ ^2[0-9][0-9]$ ]]; then
            cat "$ohlcv_response_file"
            exit 1
          fi
          jq --raw-output '
            "status: \(.status // "n/a")",
            "step: \(.step // "n/a")",
            "run_date: \(.run_date // "n/a")",
            "symbol_count: \(.symbol_count // "n/a")",
            "records_written: \(.records_written // "n/a")",
            "missing_symbols_count: \((.missing_symbols // []) | length)",
            "missing_symbol_reasons: \((.missing_symbol_reasons // {}) | @json)"
          ' "$ohlcv_response_file"
          if ! jq -e '.status == "completed"' "$ohlcv_response_file" >/dev/null; then
            echo "OHLCV repair did not reach the requested run_date; stop before rescore."
            exit 1
          fi

          refresh_response_file="$(mktemp)"
          refresh_endpoint="${ZEABUR_BACKEND_URL%/}/internal/daily-radar/refresh-avwap"
          avwap_repair_completed=true
          echo "Daily Radar repair refresh-avwap run_date: ${run_date}"
          refresh_http_status="$(curl -sS -o "$refresh_response_file" -w "%{http_code}" \
            -X POST "$refresh_endpoint" \
            -H "Authorization: Bearer ${DAILY_RADAR_INTERNAL_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${daily_radar_payload}")"
          echo "Refresh HTTP status: ${refresh_http_status}"
          if [[ ! "$refresh_http_status" =~ ^2[0-9][0-9]$ ]]; then
            cat "$refresh_response_file"
            exit 1
          fi
          jq -r '
            "status: \(.status // "n/a")",
            "step: \(.step // "n/a")",
            "run_date: \(.run_date // "n/a")",
            "symbol_count: \(.symbol_count // "n/a")",
            "records_written: \(.records_written // "n/a")",
            "missing_symbols_count: \(if (.missing_symbols | type) == "array" then (.missing_symbols | length) else "n/a" end)",
            "missing_symbol_reasons: \(.missing_symbol_reasons // {})",
            "skipped_symbols_count: \(if (.skipped_symbols | type) == "array" then (.skipped_symbols | length) else "n/a" end)",
            "skipped_symbol_reasons: \(.skipped_symbol_reasons // {})",
            "detail: \(.detail // "n/a")"
          ' "$refresh_response_file"
          if ! jq -e '.status == "completed"' "$refresh_response_file" >/dev/null; then
            echo "AVWAP repair did not complete; continue to rescore so optional evidence does not mask scoring readiness."
            avwap_repair_completed=false
          fi

          scoring_response_file="$(mktemp)"
          scoring_endpoint="${ZEABUR_BACKEND_URL%/}/internal/daily-radar/run-scoring"
          echo "Daily Radar repair run-scoring run_date: ${run_date}"
          scoring_http_status="$(curl -sS -o "$scoring_response_file" -w "%{http_code}" \
            -X POST "$scoring_endpoint" \
            -H "Authorization: Bearer ${DAILY_RADAR_INTERNAL_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${daily_radar_payload}")"
          echo "Scoring HTTP status: ${scoring_http_status}"
          if [[ ! "$scoring_http_status" =~ ^2[0-9][0-9]$ ]]; then
            cat "$scoring_response_file"
            exit 1
          fi
          jq -r '
            "run_id: \(.run_id // "n/a")",
            "status: \(.status // "n/a")",
            "run_date: \(.run_date // "n/a")",
            "universe_count: \(.universe_count // "n/a")",
            "prefilter_count: \(.prefilter_count // "n/a")",
            "candidate_count: \(.candidate_count // "n/a")",
            "errors_count: \(if (.errors | type) == "array" then (.errors | length) else "n/a" end)",
            "detail: \(.detail // "n/a")"
          ' "$scoring_response_file"
          if ! jq -e '.status == "completed" or .status == "stale_data"' "$scoring_response_file" >/dev/null; then
            exit 1
          fi
          if [[ "$avwap_repair_completed" != "true" ]]; then
            echo "AVWAP repair still incomplete after rescore attempt; fail repair monitor."
            exit 1
          fi
