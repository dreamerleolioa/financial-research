name: Daily Radar

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Daily Radar pipeline step to run."
        required: true
        default: prepare-universe
        type: choice
        options:
          - refresh-institutional-flows
          - backfill-institutional-flows
          - replay-institutional-universe
          - prepare-universe
          - refresh-market-bars
          - refresh-avwap
          - refresh-lending
          - refresh-full-margin
          - refresh-ohlcv
          - refresh-managed-raw-data
          - refresh-ai-evidence
          - refresh-market-context
          - run-forward-validation
          - run-scoring
          - repair-avwap-and-rescore
      run_date:
        description: "Optional Daily Radar run_date in Asia/Taipei calendar, YYYY-MM-DD. When omitted, the workflow run creation date is used."
        required: false
        default: ""
        type: string
      market_bar_start_date:
        description: "Optional DR2 backfill start date, YYYY-MM-DD; only used by refresh-market-bars."
        required: false
        default: ""
        type: string
      market_bar_end_date:
        description: "Optional DR2 backfill end date, YYYY-MM-DD; only used by refresh-market-bars."
        required: false
        default: ""
        type: string
      institutional_flow_start_date:
        description: "Required inclusive archive backfill start date, YYYY-MM-DD; only used by backfill-institutional-flows."
        required: false
        default: ""
        type: string
      institutional_flow_end_date:
        description: "Required inclusive archive backfill end date, YYYY-MM-DD; only used by backfill-institutional-flows. Maximum 11 calendar days."
        required: false
        default: ""
        type: string
  schedule:
    # GitHub cron uses UTC. Taiwan time = UTC+8.
    # Scheduled jobs use the UTC cron date as the intended Taiwan trading date, so delayed starts after Taiwan midnight still target the original trading date.
    # 台灣時間週一至週五 17:30，先歸檔上市櫃全市場法人買賣超。
    - cron: "30 9 * * 1-5"
    # 台灣時間週一至週五 18:00，驗證法人歸檔後準備 selected universe。
    - cron: "0 10 * * 1-5"
    # 台灣時間週一至週五 18:30，歸檔上市櫃全市場 final OHLCV。
    - cron: "30 10 * * 1-5"
    # 台灣時間週一至週五 19:00，刷新試驗版 Daily AVWAP。
    - cron: "0 11 * * 1-5"
    # 台灣時間週一至週五 20:00，刷新 lending。
    - cron: "0 12 * * 1-5"
    # 台灣時間週一至週五 21:30，等待 FinMind margin 21:00 更新後刷新 full margin。
    - cron: "30 13 * * 1-5"
    # 台灣時間週一至週五 22:30，刷新 selected-symbol OHLCV。
    - cron: "30 14 * * 1-5"
    # 台灣時間週一至週五 22:40，刷新持倉與近期分析標的的 final raw data；此步驟不阻擋 scoring。
    - cron: "40 14 * * 1-5"
    # 台灣時間週一至週五 23:00，補齊完整 AI raw pool 的獨立分析證據。
    - cron: "0 15 * * 1-5"
    # 台灣時間週一至週五 23:30，刷新 market context。
    - cron: "30 15 * * 1-5"
    # 台灣時間週一至週五 23:50，評估已成熟的 5 / 10 / 20 交易日窗口。
    - cron: "50 15 * * 1-5"
    # 台灣時間週二至週六 00:30，對前一個台北交易日 run_date 做 scoring。
    - cron: "30 16 * * 1-5"
    # 台灣時間週二至週六 07:00，補修前一個台股交易日 OHLCV 與 AVWAP，成功後重跑 scoring。
    - cron: "0 23 * * 1-5"

permissions:
  contents: read
  actions: read

jobs:
  resolve-run-context:
    name: Resolve Daily Radar run context
    runs-on: ubuntu-latest
    outputs:
      run_date: ${{ steps.resolve-date.outputs.run_date }}
      market_open: ${{ steps.market-session.outputs.market_open }}
    steps:
      - name: Check out run-date resolver
        uses: actions/checkout@v4

      - name: Resolve immutable run_date
        id: resolve-date
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DAILY_RADAR_RUN_DATE: ${{ github.event.inputs.run_date || '' }}
          DAILY_RADAR_SCHEDULE: ${{ github.event.schedule || '' }}
        run: |
          set -euo pipefail
          run_created_at="$(curl --fail-with-body -sS -L \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            | jq -r ".created_at")"
          run_date="$(python .github/scripts/resolve_daily_radar_run_date.py \
            --event-name "${GITHUB_EVENT_NAME}" \
            --schedule "${DAILY_RADAR_SCHEDULE}" \
            --run-created-at "${run_created_at}" \
            --input-run-date "${DAILY_RADAR_RUN_DATE}")"
          echo "Daily Radar resolved run_date: ${run_date}"
          echo "run_date=${run_date}" >> "${GITHUB_OUTPUT}"

      - name: Resolve TW market session
        id: market-session
        if: github.event_name != 'workflow_dispatch' || (inputs.step != 'refresh-market-bars' && inputs.step != 'backfill-institutional-flows' && inputs.step != 'replay-institutional-universe')
        env:
          ZEABUR_BACKEND_URL: ${{ secrets.ZEABUR_BACKEND_URL }}
          DAILY_RADAR_INTERNAL_TOKEN: ${{ secrets.DAILY_RADAR_INTERNAL_TOKEN }}
          DAILY_RADAR_RUN_DATE: ${{ steps.resolve-date.outputs.run_date }}
        run: |
          set -euo pipefail
          endpoint="${ZEABUR_BACKEND_URL%/}/internal/daily-radar/market-session"
          response_file="$(mktemp)"
          payload="{\"market\":\"TW\",\"run_date\":\"${DAILY_RADAR_RUN_DATE}\"}"
          http_status="$(curl -sS -o "$response_file" -w "%{http_code}" \
            -X POST "$endpoint" \
            -H "Authorization: Bearer ${DAILY_RADAR_INTERNAL_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${payload}")"
          echo "Market-session HTTP status: ${http_status}"
          if [[ ! "$http_status" =~ ^2[0-9][0-9]$ ]]; then
            cat "$response_file"
            exit 1
          fi
          jq -r '
            "status: \(.status // "n/a")",
            "run_date: \(.run_date // "n/a")",
            "market: \(.market // "n/a")",
            "provider: \(.provider // "n/a")",
            "dataset: \(.dataset // "n/a")",
            "detail: \(.detail // "n/a")"
          ' "$response_file"
          market_status="$(jq -r '.status // "unknown"' "$response_file")"
          case "$market_status" in
            open)
              echo "market_open=true" >> "${GITHUB_OUTPUT}"
              ;;
            closed)
              echo "Daily Radar skipped: TW market is closed on ${DAILY_RADAR_RUN_DATE}."
              echo "market_open=false" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "Unknown market-session status: ${market_status}"
              exit 1
              ;;
          esac

  refresh-institutional-flows:
    name: Refresh Taiwan institutional flows
    runs-on: ubuntu-latest
    needs: resolve-run-context
    if: needs.resolve-run-context.outputs.market_open == 'true' && (github.event.schedule == '30 9 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.step == 'refresh-institutional-flows'))
    steps:
      - name: Trigger refresh-institutional-flows
        env:
          ZEABUR_BACKEND_URL: ${{ secrets.ZEABUR_BACKEND_URL }}
          DAILY_RADAR_INTERNAL_TOKEN: ${{ secrets.DAILY_RADAR_INTERNAL_TOKEN }}
          DAILY_RADAR_RUN_DATE: ${{ needs.resolve-run-context.outputs.run_date }}
        run: |
          set -euo pipefail
          endpoint="${ZEABUR_BACKEND_URL%/}/internal/daily-radar/refresh-institutional-flows"
          response_file="$(mktemp)"
          payload="{\"market\":\"TW\",\"run_date\":\"${DAILY_RADAR_RUN_DATE}\"}"
          echo "Daily Radar refresh-institutional-flows run_date: ${DAILY_RADAR_RUN_DATE}"
          http_status="$(curl -sS -o "$response_file" -w "%{http_code}" \
            -X POST "$endpoint" \
            -H "Authorization: Bearer ${DAILY_RADAR_INTERNAL_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${payload}")"
          echo "HTTP status: ${http_status}"
          if [[ ! "$http_status" =~ ^2[0-9][0-9]$ ]]; then
            cat "$response_file"
            exit 1
          fi
          jq -r '
            "status: \(.status // "n/a")",
            "step: \(.step // "n/a")",
            "run_date: \(.run_date // "n/a")",
            "markets_completed: \((.markets_completed // []) | join(","))",
            "records_written: \(.records_written // 0)",
            "errors_count: \((.errors // []) | length)",
            (.snapshots[]? | "snapshot: market=\(.market) rows=\(.row_count) provider=\(.source_provider) dataset=\(.source_dataset)"),
            (.errors[]? | "error: \({code, market, trade_date, error_type} | @json)")
          ' "$response_file"
          if ! jq -e '.status == "completed" and ((.markets_completed // []) | sort) == ["TW", "TWO"]' "$response_file" >/dev/null; then
            exit 1
          fi

  backfill-institutional-flows:
    name: Backfill Taiwan institutional flow archive
    runs-on: ubuntu-latest
    needs: resolve-run-context
    if: github.event_name == 'workflow_dispatch' && inputs.step == 'backfill-institutional-flows'
    steps:
      - name: Trigger bounded institutional-flow backfill
        env:
          ZEABUR_BACKEND_URL: ${{ secrets.ZEABUR_BACKEND_URL }}
          DAILY_RADAR_INTERNAL_TOKEN: ${{ secrets.DAILY_RADAR_INTERNAL_TOKEN }}
          INSTITUTIONAL_FLOW_START_DATE: ${{ github.event.inputs.institutional_flow_start_date || '' }}
          INSTITUTIONAL_FLOW_END_DATE: ${{ github.event.inputs.institutional_flow_end_date || '' }}
        run: |
          set -euo pipefail
          if [[ -z "${INSTITUTIONAL_FLOW_START_DATE}" || -z "${INSTITUTIONAL_FLOW_END_DATE}" ]]; then
            echo "Both institutional_flow_start_date and institutional_flow_end_date are required."
            exit 1
          fi
          if [[ ! "${INSTITUTIONAL_FLOW_START_DATE}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ || ! "${INSTITUTIONAL_FLOW_END_DATE}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Institutional-flow backfill dates must use YYYY-MM-DD."
            exit 1
          fi
          endpoint="${ZEABUR_BACKEND_URL%/}/internal/daily-radar/backfill-institutional-flows"
          response_file="$(mktemp)"
          payload="$(jq -cn \
            --arg start_date "${INSTITUTIONAL_FLOW_START_DATE}" \
            --arg end_date "${INSTITUTIONAL_FLOW_END_DATE}" \
            '{market:"TW",start_date:$start_date,end_date:$end_date}')"
          http_status="$(curl -sS -o "$response_file" -w "%{http_code}" \
            -X POST "$endpoint" \
            -H "Authorization: Bearer ${DAILY_RADAR_INTERNAL_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${payload}")"
          echo "HTTP status: ${http_status}"
          if [[ ! "$http_status" =~ ^2[0-9][0-9]$ ]]; then
            cat "$response_file"
            exit 1
          fi
          jq -r '
            "status: \(.status // "n/a")",
            "range: \(.start_date // "n/a")...\(.end_date // "n/a")",
            "records_written: \(.records_written // 0)",
            "dates_completed: \((.dates_completed // []) | join(","))",
            "dates_reused: \((.dates_reused // []) | join(","))",
            "dates_repaired: \((.dates_repaired // []) | join(","))",
            "skipped_dates: \((.skipped_dates // []) | join(","))",
            (.errors[]? | "error: \({code, market, trade_date, error_type} | @json)")
          ' "$response_file"
          if ! jq -e '.status == "completed"' "$response_file" >/dev/null; then
            exit 1
          fi

  replay-institutional-universe:
    name: Compare segmented institutional universe with archive baseline
    runs-on: ubuntu-latest
    needs: resolve-run-context
    if: github.event_name == 'workflow_dispatch' && inputs.step == 'replay-institutional-universe'
    steps:
      - name: Build read-only institutional universe replay
        env:
          ZEABUR_BACKEND_URL: ${{ secrets.ZEABUR_BACKEND_URL }}
          DAILY_RADAR_INTERNAL_TOKEN: ${{ secrets.DAILY_RADAR_INTERNAL_TOKEN }}
          DAILY_RADAR_RUN_DATE: ${{ github.event.inputs.run_date || '' }}
        run: |
          set -euo pipefail
          if [[ -z "${DAILY_RADAR_RUN_DATE}" ]]; then
            echo "An explicit run_date is required for institutional-universe replay."
            exit 1
          fi
          if [[ ! "${DAILY_RADAR_RUN_DATE}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Institutional-universe replay run_date must use YYYY-MM-DD."
            exit 1
          fi
          endpoint="${ZEABUR_BACKEND_URL%/}/internal/daily-radar/institutional-universe-replay"
          response_file="${RUNNER_TEMP}/institutional-universe-replay.json"
          payload="$(jq -cn \
            --arg run_date "${DAILY_RADAR_RUN_DATE}" \
            '{market:"TW",run_date:$run_date}')"
          http_status="$(curl -sS -o "$response_file" -w "%{http_code}" \
            -X POST "$endpoint" \
            -H "Authorization: Bearer ${DAILY_RADAR_INTERNAL_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${payload}")"
          echo "HTTP status: ${http_status}"
          if [[ ! "$http_status" =~ ^2[0-9][0-9]$ ]]; then
            cat "$response_file"
            exit 1
          fi
          jq -r '
            "status: \(.status // "n/a")",
            "run_date: \(.run_date // "n/a")",
            "report_version: \(.report.report_version // "n/a")",
            "complete_market_days: \(.report.source.complete_market_days // 0)",
            "segmented_count: \(.report.segmented.universe_count // 0)",
            "baseline_count: \(.report.baseline.universe_count // 0)",
            "overlap_count: \(.report.comparison.overlap_count // 0)",
            "jaccard_ratio: \(.report.comparison.jaccard_ratio // 0)",
            "ready_for_human_review: \(.report.calibration_gate.ready_for_human_review // false)",
            "auto_apply_scoring_change: \(.report.calibration_gate.auto_apply_scoring_change // false)"
          ' "$response_file"
          if ! jq -e '.status == "completed" and .report.calibration_gate.ready_for_human_review == true and .report.calibration_gate.auto_apply_scoring_change == false' "$response_file" >/dev/null; then
            exit 1
          fi

      - name: Upload institutional universe replay report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: institutional-universe-replay-${{ github.event.inputs.run_date }}
          path: ${{ runner.temp }}/institutional-universe-replay.json
          if-no-files-found: warn
          retention-days: 14

  prepare-universe:
    name: Prepare Daily Radar universe
    runs-on: ubuntu-latest
    needs: resolve-run-context
    if: needs.resolve-run-context.outputs.market_open == 'true' && (github.event.schedule == '0 10 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.step == 'prepare-universe'))
    steps:
      - name: Trigger prepare-universe
        env:
          ZEABUR_BACKEND_URL: ${{ secrets.ZEABUR_BACKEND_URL }}
          DAILY_RADAR_INTERNAL_TOKEN: ${{ secrets.DAILY_RADAR_INTERNAL_TOKEN }}
          DAILY_RADAR_ENDPOINT: /internal/daily-radar/prepare-universe
          DAILY_RADAR_RUN_DATE: ${{ needs.resolve-run-context.outputs.run_date }}
        run: |
          set -euo pipefail
          endpoint="${ZEABUR_BACKEND_URL%/}${DAILY_RADAR_ENDPOINT}"
          response_file="$(mktemp)"
          run_date="${DAILY_RADAR_RUN_DATE}"
          daily_radar_payload="{\"market\":\"TW\",\"run_date\":\"${run_date}\",\"max_symbols\":250}"
          echo "Daily Radar prepare-universe run_date: ${run_date}"
          http_status="$(curl -sS -o "$response_file" -w "%{http_code}" \
            -X POST "$endpoint" \
            -H "Authorization: Bearer ${DAILY_RADAR_INTERNAL_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${daily_radar_payload}")"
          echo "HTTP status: ${http_status}"
          if [[ ! "$http_status" =~ ^2[0-9][0-9]$ ]]; then
            cat "$response_file"
            exit 1
          fi
          jq -r '
            "status: \(.status // "n/a")",
            "run_date: \(.run_date // "n/a")",
            "market: \(.market // "n/a")",
            "symbol_count: \(.symbol_count // "n/a")",
            "errors_count: \(if (.errors | type) == "array" then (.errors | length) else "n/a" end)",
            "detail: \(.detail // "n/a")"
          ' "$response_file"
          if ! jq -e '.status == "prepared"' "$response_file" >/dev/null; then
            exit 1
          fi

  refresh-avwap:
    name: Refresh Daily Radar AVWAP
    runs-on: ubuntu-latest
    needs: resolve-run-context
    if: needs.resolve-run-context.outputs.market_open == 'true' && (github.event.schedule == '0 11 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.step == 'refresh-avwap'))
    steps:
      - name: Trigger refresh-avwap
        env:
          ZEABUR_BACKEND_URL: ${{ secrets.ZEABUR_BACKEND_URL }}
          DAILY_RADAR_INTERNAL_TOKEN: ${{ secrets.DAILY_RADAR_INTERNAL_TOKEN }}
          DAILY_RADAR_ENDPOINT: /internal/daily-radar/refresh-avwap
          DAILY_RADAR_RUN_DATE: ${{ needs.resolve-run-context.outputs.run_date }}
        run: |
          set -euo pipefail
          endpoint="${ZEABUR_BACKEND_URL%/}${DAILY_RADAR_ENDPOINT}"
          response_file="$(mktemp)"
          run_date="${DAILY_RADAR_RUN_DATE}"
          daily_radar_payload="{\"market\":\"TW\",\"run_date\":\"${run_date}\"}"
          echo "Daily Radar refresh-avwap run_date: ${run_date}"
          http_status="$(curl -sS -o "$response_file" -w "%{http_code}" \
            -X POST "$endpoint" \
            -H "Authorization: Bearer ${DAILY_RADAR_INTERNAL_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${daily_radar_payload}")"
          echo "HTTP status: ${http_status}"
          if [[ ! "$http_status" =~ ^2[0-9][0-9]$ ]]; then
            cat "$response_file"
            exit 1
          fi
          jq -r '
            "status: \(.status // "n/a")",
            "step: \(.step // "n/a")",
            "run_date: \(.run_date // "n/a")",
            "symbol_count: \(.symbol_count // "n/a")",
            "records_written: \(.records_written // "n/a")",
            "missing_symbols_count: \(if (.missing_symbols | type) == "array" then (.missing_symbols | length) else "n/a" end)",
            "missing_symbol_reasons: \(.missing_symbol_reasons // {})",
            "skipped_symbols_count: \(if (.skipped_symbols | type) == "array" then (.skipped_symbols | length) else "n/a" end)",
            "skipped_symbol_reasons: \(.skipped_symbol_reasons // {})",
            "detail: \(.detail // "n/a")"
          ' "$response_file"
          if ! jq -e '.status == "completed"' "$response_file" >/dev/null; then
            echo "AVWAP refresh is optional evidence for scoring; leaving job successful for non-completed business status."
          fi

  refresh-market-bars:
    name: Refresh Taiwan market bars
    runs-on: ubuntu-latest
    needs: resolve-run-context
    if: (needs.resolve-run-context.outputs.market_open == 'true' && github.event.schedule == '30 10 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.step == 'refresh-market-bars')
    steps:
      - name: Trigger refresh-market-bars
        env:
          ZEABUR_BACKEND_URL: ${{ secrets.ZEABUR_BACKEND_URL }}
          DAILY_RADAR_INTERNAL_TOKEN: ${{ secrets.DAILY_RADAR_INTERNAL_TOKEN }}
          DAILY_RADAR_RUN_DATE: ${{ needs.resolve-run-context.outputs.run_date }}
          MARKET_BAR_START_DATE: ${{ github.event.inputs.market_bar_start_date || '' }}
          MARKET_BAR_END_DATE: ${{ github.event.inputs.market_bar_end_date || '' }}
        run: |
          set -euo pipefail
          endpoint="${ZEABUR_BACKEND_URL%/}/internal/daily-radar/refresh-market-bars"
          response_file="$(mktemp)"
          if [[ -n "${MARKET_BAR_START_DATE}" || -n "${MARKET_BAR_END_DATE}" ]]; then
            if [[ -z "${MARKET_BAR_START_DATE}" || -z "${MARKET_BAR_END_DATE}" ]]; then
              echo "Both market_bar_start_date and market_bar_end_date are required for backfill."
              exit 1
            fi
            payload="{\"market\":\"TW\",\"start_date\":\"${MARKET_BAR_START_DATE}\",\"end_date\":\"${MARKET_BAR_END_DATE}\"}"
          else
            payload="{\"market\":\"TW\",\"run_date\":\"${DAILY_RADAR_RUN_DATE}\"}"
          fi
          http_status="$(curl -sS -o "$response_file" -w "%{http_code}" \
            -X POST "$endpoint" \
            -H "Authorization: Bearer ${DAILY_RADAR_INTERNAL_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${payload}")"
          cat "$response_file"
          if [[ ! "$http_status" =~ ^2[0-9][0-9]$ ]]; then
            exit 1
          fi
          if ! jq -e '.status == "completed"' "$response_file" >/dev/null; then
            exit 1
          fi

  refresh-lending:
    name: Refresh Daily Radar lending
    runs-on: ubuntu-latest
    needs: resolve-run-context
    if: needs.resolve-run-context.outputs.market_open == 'true' && (github.event.schedule == '0 12 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.step == 'refresh-lending'))
    steps:
      - name: Trigger refresh-lending
        env:
          ZEABUR_BACKEND_URL: ${{ secrets.ZEABUR_BACKEND_URL }}
          DAILY_RADAR_INTERNAL_TOKEN: ${{ secrets.DAILY_RADAR_INTERNAL_TOKEN }}
          DAILY_RADAR_ENDPOINT: /internal/daily-radar/refresh-lending
          DAILY_RADAR_RUN_DATE: ${{ needs.resolve-run-context.outputs.run_date }}
        run: |
          set -euo pipefail
          endpoint="${ZEABUR_BACKEND_URL%/}${DAILY_RADAR_ENDPOINT}"
          response_file="$(mktemp)"
          run_date="${DAILY_RADAR_RUN_DATE}"
          daily_radar_payload="{\"market\":\"TW\",\"run_date\":\"${run_date}\"}"
          echo "Daily Radar refresh-lending run_date: ${run_date}"
          http_status="$(curl -sS -o "$response_file" -w "%{http_code}" \
            -X POST "$endpoint" \
            -H "Authorization: Bearer ${DAILY_RADAR_INTERNAL_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${daily_radar_payload}")"
          echo "HTTP status: ${http_status}"
          if [[ ! "$http_status" =~ ^2[0-9][0-9]$ ]]; then
            cat "$response_file"
            exit 1
          fi
          jq -r '
            "status: \(.status // "n/a")",
            "step: \(.step // "n/a")",
            "run_date: \(.run_date // "n/a")",
            "symbol_count: \(.symbol_count // "n/a")",
            "records_written: \(.records_written // "n/a")",
            "missing_symbols_count: \((.missing_symbols // []) | length)",
            "missing_symbol_reasons: \((.missing_symbol_reasons // {}) | @json)",
            "errors_count: \(if (.errors | type) == "array" then (.errors | length) else "n/a" end)",
            "detail: \(.detail // "n/a")",
            (.errors[]? | "error: \(. | @json)")
          ' "$response_file"
          if ! jq -e '.status == "completed"' "$response_file" >/dev/null; then
            exit 1
          fi

  refresh-full-margin:
    name: Refresh Daily Radar full margin
    runs-on: ubuntu-latest
    needs: resolve-run-context
