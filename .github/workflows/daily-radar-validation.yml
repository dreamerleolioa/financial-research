name: Daily Radar forward validation
on:
  schedule:
    # Tue–Sat in Taipei. Both dated slots retain their originating UTC trading date.
    - cron: "15 18 * * 1-5"  # 02:15
    - cron: "45 22 * * 1-5"  # 06:45 repair
    # Resume stored dates in the other slots. Leave 17:45 Taipei to the weekday Radar archive.
    - cron: "15 0-17,19-23 * * *"
    - cron: "45 0-8,10-21,23 * * *"
    - cron: "15 18 * * 0,6"
    - cron: "45 9,22 * * 0,6"
  workflow_dispatch:
    inputs:
      run_date:
        description: Optional Taiwan trading date (YYYY-MM-DD)
        type: string
  workflow_call:
    inputs:
      run_date:
        type: string
    secrets:
      ZEABUR_BACKEND_URL:
        required: true
      DAILY_RADAR_INTERNAL_TOKEN:
        required: true

permissions:
  contents: read
  actions: read

jobs:
  resolve-run-context:
    if: github.event_name != 'schedule' || endsWith(github.event.schedule, ' 1-5')
    uses: ./.github/workflows/daily-radar-context.yml
    with:
      run_date: ${{ inputs.run_date || '' }}
      check_market: ${{ vars.DAILY_RADAR_RELIABILITY_ENABLED != 'true' }}
    secrets:
      ZEABUR_BACKEND_URL: ${{ secrets.ZEABUR_BACKEND_URL }}
      DAILY_RADAR_INTERNAL_TOKEN: ${{ secrets.DAILY_RADAR_INTERNAL_TOKEN }}

  run-forward-validation:
    name: Validate Daily Radar ${{ matrix.return_basis }}
    runs-on: ubuntu-latest
    needs: resolve-run-context
    strategy:
      fail-fast: false
      matrix:
        return_basis: [signal_close, next_open]
    concurrency:
      group: daily-radar-validation
      cancel-in-progress: false
      queue: max
    if: vars.DAILY_RADAR_RELIABILITY_ENABLED != 'true' && needs.resolve-run-context.outputs.market_open == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate mature windows in both return bases
        env:
          ZEABUR_BACKEND_URL: ${{ secrets.ZEABUR_BACKEND_URL }}
          DAILY_RADAR_INTERNAL_TOKEN: ${{ secrets.DAILY_RADAR_INTERNAL_TOKEN }}
          DAILY_RADAR_RUN_DATE: ${{ needs.resolve-run-context.outputs.run_date }}
          DAILY_RADAR_RETURN_BASIS: ${{ matrix.return_basis }}
        run: python .github/scripts/run_daily_radar_validation.py --run-date "$DAILY_RADAR_RUN_DATE" --return-basis "$DAILY_RADAR_RETURN_BASIS" --output-dir "$RUNNER_TEMP/radar-validation"
      - name: Read validation coverage
        if: always()
        env:
          ZEABUR_BACKEND_URL: ${{ secrets.ZEABUR_BACKEND_URL }}
          DAILY_RADAR_INTERNAL_TOKEN: ${{ secrets.DAILY_RADAR_INTERNAL_TOKEN }}
          DAILY_RADAR_RUN_DATE: ${{ needs.resolve-run-context.outputs.run_date }}
          DAILY_RADAR_RETURN_BASIS: ${{ matrix.return_basis }}
        run: python .github/scripts/check_daily_radar_readiness.py --run-date "$DAILY_RADAR_RUN_DATE" --scope "$DAILY_RADAR_RETURN_BASIS" --output-dir "$RUNNER_TEMP/radar-validation"
      - name: Preserve validation diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: radar-validation-${{ matrix.return_basis }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/radar-validation/
          retention-days: 30

  durable-validation:
    needs: resolve-run-context
    if: always() && vars.DAILY_RADAR_RELIABILITY_ENABLED == 'true' && (needs.resolve-run-context.result == 'skipped' || needs.resolve-run-context.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: daily-radar-validation-durable
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Register intent or resume stored dates
        env:
          ZEABUR_BACKEND_URL: ${{ secrets.ZEABUR_BACKEND_URL }}
          DAILY_RADAR_INTERNAL_TOKEN: ${{ secrets.DAILY_RADAR_INTERNAL_TOKEN }}
          DAILY_RADAR_RUN_DATE: ${{ needs.resolve-run-context.outputs.run_date }}
          DAILY_RADAR_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          args=(--owner validation --output-dir "$RUNNER_TEMP/radar-validation" --max-seconds 1200)
          if [[ -n "$DAILY_RADAR_SCHEDULE" && "$DAILY_RADAR_SCHEDULE" != *' 1-5' ]]; then
            args+=(--resume --max-work 150)
          else
            args+=(--run-date "$DAILY_RADAR_RUN_DATE" --max-work 2000 --require-lanes signal_close,next_open
                   --known-validation-gaps .github/data/daily-radar-known-validation-gaps.json)
          fi
          python .github/scripts/run_daily_radar_jobs.py "${args[@]}"
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: radar-durable-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/radar-validation/
          if-no-files-found: warn
