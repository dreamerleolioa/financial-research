name: CI/CD

on:
  push:
    branches: [main, codex/gcp-test-migration]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_gcp_test:
        description: Deploy the isolated GCP test service after all checks
        required: true
        type: boolean
        default: false

jobs:
  # ── 後端測試 ─────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest tests/ -v
        env:
          # 測試時用假 key，避免真實呼叫 API
          ANTHROPIC_API_KEY: test-key
          JWT_SECRET: test-secret-for-ci-only
          DATABASE_URL: sqlite:///./test.db
          GOOGLE_CLIENT_ID: test-google-client-id
          GOOGLE_CLIENT_SECRET: test-google-client-secret

  test-frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Run frontend E2E
        run: pnpm test:e2e

      - name: Build
        run: pnpm build
        env:
          VITE_API_URL: http://localhost:8000
          VITE_GOOGLE_CLIENT_ID: test-google-client-id

  # ── 前端 Build + Deploy to GitHub Pages ──────────────────────
  deploy-frontend:
    name: Deploy Frontend to GitHub Pages
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # GitHub Pages 的 base path，格式 /<repo-name>/
          VITE_BASE_URL: /${{ github.event.repository.name }}/
          # Zeabur 後端 URL（從 GitHub Actions Variables 注入）
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          # Google OAuth Client ID（從 GitHub Actions Variables 注入）
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  deploy-gcp-test:
    name: Deploy GCP test backend
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, test-postgres-migration]
    if: github.ref == 'refs/heads/codex/gcp-test-migration' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_gcp_test))
    environment: gcp-test
    concurrency:
      group: deploy-gcp-test
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: asia-east1
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate test deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOY_SERVICE_ACCOUNT; do
            test -n "${!name}" || { echo "Missing $name" >&2; exit 1; }
          done
          test "$GCP_PROJECT_ID" = financial-research-20261019
      - name: Authenticate with short-lived GitHub OIDC credentials
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
      - uses: astral-sh/setup-uv@v5
      - name: Set up Python for image verification
        run: uv python install 3.14
      - name: Install locked image verification dependencies
        working-directory: backend
        run: uv sync --locked
      - uses: docker/setup-buildx-action@v3
      - name: Build immutable backend image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: asia-east1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/financial-research/backend:${{ github.sha }}
      - name: Verify the exact image against PostgreSQL 17
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          image="asia-east1-docker.pkg.dev/$GCP_PROJECT_ID/financial-research/backend@$IMAGE_DIGEST"
          docker pull "$image"
          GCP_MIGRATION_IMAGE="$image" bash scripts/gcp/test-migration.sh
      - name: Deploy private test service
        id: deploy
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          bash scripts/gcp/deploy-test.sh "asia-east1-docker.pkg.dev/$GCP_PROJECT_ID/financial-research/backend@$IMAGE_DIGEST"
      - name: Mint audience-specific health-check token through WIF
        id: health-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.deploy.outputs.service_url }}
          id_token_include_email: true
      - name: Verify private service health
        env:
          GCP_TEST_SERVICE_URL: ${{ steps.deploy.outputs.service_url }}
          GCP_TEST_ID_TOKEN: ${{ steps.health-auth.outputs.id_token }}
        run: bash scripts/gcp/smoke-test.sh

  test-postgres-migration:
    name: PostgreSQL 17 migration rehearsal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.14
      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Verify PostgreSQL 17 snapshot and restore
        run: bash scripts/gcp/test-migration.sh
